services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: vinculatec
      POSTGRES_PASSWORD: vinculatec
      POSTGRES_DB: vinculatec
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vinculatec"]
      interval: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://vinculatec:vinculatec@db:5432/vinculatec
      SECRET_KEY: ${SECRET_KEY:-cambia-esta-clave-en-produccion-por-una-larga-y-aleatoria}
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
